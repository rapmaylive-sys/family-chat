<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamilyConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Стили для плавного исчезновения и скроллбара */
        .fade-out { transition: opacity 1.5s ease-out; opacity: 0 !important; }
        .message-bubble { transition: all 0.3s ease; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        /* Прячем системный скроллбар для красоты */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #17212b; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen flex items-center justify-center m-0 overflow-hidden font-sans">

    <!-- Экран входа -->
    <div id="loginScreen" class="w-full max-w-sm bg-[#17212b] p-8 rounded-2xl shadow-2xl text-center z-50">
        <h1 class="text-3xl font-bold mb-2 text-white">FamilyConnect</h1>
        <p class="text-gray-400 mb-6 text-sm">Введите семейный пароль</p>
        <input type="password" id="passInput" placeholder="Пароль..." 
               class="w-full p-4 mb-4 rounded-xl bg-[#242f3d] border border-transparent focus:outline-none focus:border-[#2b5278] text-white transition">
        <button id="loginBtn" class="w-full py-4 bg-[#5288c1] rounded-xl hover:bg-[#4374a5] transition font-bold text-lg shadow-lg">Войти</button>
    </div>

    <!-- Основной чат (Telegram Style) -->
    <div id="chatContainer" class="hidden w-full h-full max-w-md bg-[#0e1621] flex flex-col relative shadow-2xl sm:h-[90vh] sm:rounded-3xl overflow-hidden border border-gray-800">
        
        <!-- Шапка чата -->
        <div class="bg-[#17212b] px-4 py-3 flex items-center gap-3 shadow-md z-10">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center font-bold text-lg">
                FC
            </div>
            <div>
                <h2 class="font-bold text-white leading-tight">Семейный чат</h2>
                <p class="text-xs text-[#5288c1]">в сети</p>
            </div>
        </div>

        <!-- Поле сообщений -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 pb-20 relative">
            <!-- Фоновый узор (опционально, делает похоже на ТГ) -->
            <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');"></div>
        </div>

        <!-- Панель смайликов (скрыта по умолчанию) -->
        <div id="emojiPicker" class="hidden absolute bottom-16 left-0 right-0 bg-[#17212b] p-3 grid grid-cols-6 gap-2 border-t border-gray-800 z-20 rounded-t-xl shadow-lg">
            <!-- Смайлики будут добавлены через JS -->
        </div>

        <!-- Панель ввода -->
        <div class="bg-[#17212b] px-2 py-2 flex items-end gap-2 z-30">
            <button id="emojiToggleBtn" class="p-3 text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </button>
            <textarea id="msgInput" rows="1" placeholder="Сообщение..." class="flex-1 max-h-32 min-h-[44px] p-3 my-1 rounded-xl bg-[#242f3d] focus:outline-none text-white resize-none"></textarea>
            <button id="sendBtn" class="p-3 mb-1 bg-[#5288c1] rounded-full text-white hover:bg-[#4374a5] transition flex-shrink-0 shadow-md">
                <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZ82pn4M8CX_2ySPBXjDBscfZVpS7mo_o",
            authDomain: "familyconnect-f3026.firebaseapp.com",
            databaseURL: "https://familyconnect-f3026-default-rtdb.firebaseio.com",
            projectId: "familyconnect-f3026",
            storageBucket: "familyconnect-f3026.firebasestorage.app",
            messagingSenderId: "586629397170",
            appId: "1:586629397170:web:2560475f7b9c1315fda7ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, firebaseConfig.databaseURL);
        const messagesRef = ref(db, 'messages');

        // Генерируем ID для этого браузера, чтобы отличать свои сообщения от чужих
        if (!localStorage.getItem('myChatId')) {
            localStorage.setItem('myChatId', Math.random().toString(36).substring(2, 10));
        }
        const myId = localStorage.getItem('myChatId');

        let audioCtx;
        const playSound = () => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        };

        const msgInput = document.getElementById('msgInput');
        
        // Смайлики
        const emojis = ['😀','😂','🥰','😎','🤔','👍','❤️','🔥','🎉','😢','👀','🙏'];
        const picker = document.getElementById('emojiPicker');
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.className = "text-2xl hover:scale-110 transition";
            btn.textContent = e;
            btn.onclick = () => { msgInput.value += e; picker.classList.add('hidden'); };
            picker.appendChild(btn);
        });

        document.getElementById('emojiToggleBtn').onclick = () => {
            picker.classList.toggle('hidden');
        };

        // Вход
        document.getElementById('loginBtn').addEventListener('click', () => {
            if (document.getElementById('passInput').value.trim() === "pipiki") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('chatContainer').classList.remove('hidden');
                
                // Инициализируем звук и уведомления только после клика пользователя!
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (Notification.permission !== "granted") Notification.requestPermission();
            } else {
                alert("Неверный пароль!");
            }
        });

        // Отправка сообщений
        const sendMessage = () => {
            if (msgInput.value.trim() !== "") {
                push(messagesRef, { 
                    text: msgInput.value.trim(), 
                    time: Date.now(),
                    sender: myId // Отправляем наш ID
                });
                msgInput.value = "";
                msgInput.style.height = 'auto'; // Сброс высоты
                picker.classList.add('hidden');
            }
        };

        document.getElementById('sendBtn').onclick = sendMessage;
        
        // Отправка по Enter (Shift+Enter для переноса строки)
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Авто-расширение поля ввода
        msgInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const isMe = msg.sender === myId; // Проверяем, мы ли отправили

            const div = document.createElement('div');
            div.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'} message-bubble`;
            
            const timeDate = new Date(msg.time);
            const timeStr = timeDate.getHours().toString().padStart(2, '0') + ':' + timeDate.getMinutes().toString().padStart(2, '0');

            // Цвета в стиле Telegram: синий для своих, серый для чужих
            const bubbleColor = isMe ? 'bg-[#2b5278] text-white' : 'bg-[#182533] text-gray-100';
            const borderRadius = isMe ? 'rounded-2xl rounded-tr-sm' : 'rounded-2xl rounded-tl-sm';

            div.innerHTML = `
                <div class="relative max-w-[80%] px-4 py-2 shadow-sm ${bubbleColor} ${borderRadius}">
                    <div class="break-words pr-8 leading-relaxed">${msg.text}</div>
                    <div class="absolute bottom-1 right-2 text-[10px] text-gray-400 select-none flex items-center gap-1">
                        ${timeStr}
                        ${isMe ? '<svg class="w-3 h-3 text-[#5288c1]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                    </div>
                </div>
            `;
            
            const msgsDiv = document.getElementById('messages');
            msgsDiv.appendChild(div);
            msgsDiv.scrollTop = msgsDiv.scrollHeight;

            // Звук и уведомления только для ЧУЖИХ сообщений
            if (!isMe) {
                playSound();
                if (Notification.permission === "granted" && document.hidden) {
                    new Notification("Новое сообщение (FamilyConnect)", { body: msg.text });
                }
            }

            // Авто-удаление через 60 секунд (1 минута)
            setTimeout(() => {
                div.classList.add('fade-out');
                setTimeout(() => div.remove(), 1500); // Ждем окончания анимации
            }, 60000); 
        });
    </script>
</body>
</html>
