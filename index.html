<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-zinc-900 border border-white/10 rounded-3xl p-6 shadow-2xl h-[85vh] flex flex-col">
        <h1 class="text-center font-bold text-xl mb-4 text-white">FamilyConnect</h1>
        
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 mb-4 pr-2 scrollbar-thin">
            <!-- Messages will appear here -->
        </div>

        <div class="flex gap-2">
            <input id="msgInput" type="text" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 outline-none text-white focus:border-indigo-500" placeholder="Ваше сообщение...">
            <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 rounded-xl font-bold transition">></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZ82pn4M8CX_2ySPBXjDBscfZVpS7mo_o",
            authDomain: "familyconnect-f3026.firebaseapp.com",
            databaseURL: "https://familyconnect-f3026-default-rtdb.firebaseio.com",
            projectId: "familyconnect-f3026",
            storageBucket: "familyconnect-f3026.appspot.com",
            messagingSenderId: "586629397170",
            appId: "1:586629397170:web:b03c6fe2a85a93fcfda7ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'messages');

        window.sendMessage = () => {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            push(chatRef, { text: input.value, time: Date.now() });
            input.value = '';
        };

        // Handle Enter key
        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') window.sendMessage();
        });

        onChildAdded(chatRef, (snap) => {
            const msgData = snap.val();
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = "bg-zinc-800 p-3 rounded-2xl text-sm border border-white/5 shadow-sm animate-in fade-in slide-in-from-bottom-2 duration-300";
            div.textContent = msgData.text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
