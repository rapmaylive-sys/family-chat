<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamilyConnect - Чат + Рация</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0e1621] text-white h-screen flex flex-col items-center justify-center font-sans">

    <!-- Интерфейс чата -->
    <div id="chat" class="w-full max-w-md h-full flex flex-col bg-[#0e1621]">
        <div class="p-4 bg-[#17212b] shadow-md font-bold text-lg text-center">FamilyConnect</div>
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        
        <!-- Панель ввода -->
        <div class="p-3 bg-[#17212b] flex items-center gap-2">
            <input type="text" id="msgInput" placeholder="Сообщение..." class="flex-1 p-3 rounded-full bg-[#242f3d] focus:outline-none text-white">
            <button id="sendBtn" class="p-4 bg-blue-600 rounded-full hover:bg-blue-700 transition">✉️</button>
            <button id="recordBtn" class="p-4 bg-red-600 rounded-full hover:bg-red-700 transition touch-none">🎤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZ82pn4M8CX_2ySPBXjDBscfZVpS7mo_o",
            databaseURL: "https://familyconnect-f3026-default-rtdb.firebaseio.com",
            projectId: "familyconnect-f3026",
            storageBucket: "familyconnect-f3026.firebasestorage.app",
            appId: "1:586629397170:web:2560475f7b9c1315fda7ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);
        const messagesRef = ref(db, 'messages');

        // Отправка текста
        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            if (input.value.trim() !== "") {
                push(messagesRef, { type: 'text', text: input.value, time: Date.now() });
                input.value = "";
            }
        };

        // Запись голоса
        const btn = document.getElementById('recordBtn');
        let mediaRecorder, audioChunks;

        const startRecording = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                const storageReference = storageRef(storage, 'audio/' + Date.now() + '.ogg');
                await uploadBytes(storageReference, audioBlob);
                const url = await getDownloadURL(storageReference);
                push(messagesRef, { type: 'audio', url: url, time: Date.now() });
            };
            mediaRecorder.start();
        };

        btn.addEventListener('mousedown', startRecording);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        btn.addEventListener('mouseup', () => mediaRecorder.stop());
        btn.addEventListener('touchend', () => mediaRecorder.stop());

        // Рендер сообщений
        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const div = document.createElement('div');
            div.className = "p-3 bg-[#2b5278] rounded-2xl w-fit text-sm";
            if (msg.type === 'text') {
                div.textContent = msg.text;
            } else {
                div.innerHTML = `<audio controls src="${msg.url}" class="h-8"></audio>`;
            }
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
    </script>
</body>
</html>
```eof

Теперь у вас в одном флаконе:
1. **Текстовый чат** (через кнопку ✉️).
2. **Рация** (через кнопку 🎤).
3. **Общая база** (все данные хранятся и подгружаются автоматически).
