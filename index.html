<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyConnect - Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Экран входа -->
    <div id="loginScreen" class="w-full max-w-sm bg-gray-800 p-8 rounded-2xl shadow-xl text-center">
        <h1 class="text-2xl font-bold mb-6">FamilyConnect</h1>
        <input type="password" id="passInput" placeholder="Введите пароль" 
               class="w-full p-3 mb-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
        <button onclick="checkAccess()" class="w-full py-3 bg-blue-600 rounded-lg hover:bg-blue-700 transition">Войти</button>
    </div>

    <!-- Основной чат (скрыт по умолчанию) -->
    <div id="chatContainer" class="hidden w-full max-w-lg bg-gray-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-xl font-bold mb-4">Семейный чат</h2>
        <div id="messages" class="h-64 overflow-y-auto mb-4 border-b border-gray-700 pb-2"></div>
        <div class="flex gap-2">
            <input type="text" id="msgInput" placeholder="Ваше сообщение..." class="flex-1 p-2 rounded-lg bg-gray-700">
            <button id="sendBtn" class="px-4 py-2 bg-blue-600 rounded-lg">Отправить</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            // Вставьте сюда ваш конфиг из консоли Firebase
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        // Логика пароля
        window.checkAccess = () => {
            const pass = document.getElementById('passInput').value;
            if (pass === "пипики") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('chatContainer').classList.remove('hidden');
            } else {
                alert("Неверный пароль!");
            }
        };

        // Логика чата
        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            if (input.value) {
                push(messagesRef, { text: input.value, time: Date.now() });
                input.value = "";
            }
        };

        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const div = document.createElement('div');
            div.className = "mb-2 p-2 bg-gray-700 rounded-lg";
            div.textContent = msg.text;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
    </script>
</body>
</html>
