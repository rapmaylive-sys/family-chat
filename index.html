<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyConnect</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Экран входа -->
    <div id="loginScreen" class="w-full max-w-sm bg-gray-800 p-8 rounded-2xl shadow-xl text-center">
        <h1 class="text-2xl font-bold mb-6 text-blue-400">FamilyConnect</h1>
        <input type="password" id="passInput" placeholder="Введите пароль" 
               class="w-full p-3 mb-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 text-white">
        <button id="loginBtn" class="w-full py-3 bg-blue-600 rounded-lg hover:bg-blue-700 transition font-bold">Войти</button>
    </div>

    <!-- Основной чат -->
    <div id="chatContainer" class="hidden w-full max-w-lg bg-gray-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-xl font-bold mb-4 text-blue-400">Семейный чат</h2>
        <div id="messages" class="h-64 overflow-y-auto mb-4 border-b border-gray-700 pb-2 space-y-2"></div>
        <div class="flex gap-2">
            <input type="text" id="msgInput" placeholder="Ваше сообщение..." class="flex-1 p-2 rounded-lg bg-gray-700 focus:outline-none text-white">
            <button id="sendBtn" class="px-6 py-2 bg-blue-600 rounded-lg hover:bg-blue-700 transition font-bold">></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "[https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js)";
        import { getDatabase, ref, push, onChildAdded } from "[https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js)";

        const firebaseConfig = {
            apiKey: "AIzaSyDZ82pn4M8CX_2ySPBXjDBscfZVpS7mo_o",
            authDomain: "familyconnect-f3026.firebaseapp.com",
            databaseURL: "[https://familyconnect-f3026-default-rtdb.firebaseio.com](https://familyconnect-f3026-default-rtdb.firebaseio.com)",
            projectId: "familyconnect-f3026",
            storageBucket: "familyconnect-f3026.firebasestorage.app",
            messagingSenderId: "586629397170",
            appId: "1:586629397170:web:2560475f7b9c1315fda7ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, firebaseConfig.databaseURL);
        const messagesRef = ref(db, 'messages');

        document.getElementById('loginBtn').addEventListener('click', () => {
            if (document.getElementById('passInput').value.trim() === "pipiki") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('chatContainer').classList.remove('hidden');
            } else {
                alert("Неверный пароль!");
            }
        });

        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            if (input.value.trim() !== "") {
                push(messagesRef, { text: input.value, time: Date.now() });
                input.value = "";
            }
        };

        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const div = document.createElement('div');
            div.className = "p-2 bg-gray-700 rounded-lg text-sm";
            div.textContent = msg.text;
            const msgsDiv = document.getElementById('messages');
            msgsDiv.appendChild(div);
            msgsDiv.scrollTop = msgsDiv.scrollHeight;
        });
    </script>
</body>
</html>
