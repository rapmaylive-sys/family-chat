<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Брови Шашки</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #020617 0%, #082f49 50%, #0369a1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            width: 100%;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            background: linear-gradient(45deg, #38bdf8, #34d399, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #status {
            display: inline-block;
            font-size: 1rem;
            background: rgba(15, 23, 42, 0.85);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
        }
        button {
            background: linear-gradient(135deg, #0ea5e9, #0369a1);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            transition: all 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
            background: linear-gradient(135deg, #38bdf8, #0284c7);
        }
        button:active {
            transform: translateY(1px);
        }
        #arazaur-popup {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(16, 185, 129, 0.9);
            border: 3px solid #6ee7b7;
            color: #fff;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #arazaur-popup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>Брови Шашки 🌊🦐</h1>
        <div id="status">Ход: Креветки (Красные)</div>
    </div>

    <div id="arazaur-popup">
        <span id="arazaur-text">🦖 АРАЗАВР: ЭПИК!</span>
    </div>

    <div id="controls">
        <button onclick="resetGame()">Новая игра</button>
        <button onclick="toggleCamera()">Сменить ракурс</button>
    </div>

    <script>
        let scene, camera, renderer;
        let piecesGroup = new THREE.Group();
        let tilesGroup = new THREE.Group();
        let effectsGroup = new THREE.Group();
        let bubbles = [];
        let splashes = [];
        let selectedPiece = null;
        let turn = 'red'; // 'red' (креветки) или 'blue' (крабики)
        let gameState = Array(8).fill(null).map(() => Array(8).fill(0));
        let audioCtx = null;

        // Параметры для вращения доски мышкой / тачем
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0.8;
        let cameraAngleY = 0;
        let cameraDistance = 9.5;

        const boardSize = 8;
        const tileSize = 1.0;
        const originOffset = ((boardSize - 1) * tileSize) / 2;

        const arazaurPhrases = [
            "🦖 АРАЗАВР: ЭПИК ХОД!",
            "🦖 КРЕВЕТКИ В АТАКЕ!",
            "🦖 МОЩНЫЙ УДАР КРАБИКОВ!",
            "🦖 ЭТО БЫЛ ШИКАРНЫЙ ПРЫЖОК!",
            "🦖 ДАМКА В ИГРЕ! ОПАСНО!",
            "🦖 АРАЗАВР ОДОБРЯЕТ!"
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'king') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        function showArazaurReaction(customText) {
            const popup = document.getElementById('arazaur-popup');
            const textSpan = document.getElementById('arazaur-text');
            textSpan.innerText = customText || arazaurPhrases[Math.floor(Math.random() * arazaurPhrases.length)];
            
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 2000);
        }

        function createSplash(x, z) {
            const particleGeo = new THREE.SphereGeometry(0.05, 8, 8);
            const particleMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
            
            for (let i = 0; i < 12; i++) {
                const particle = new THREE.Mesh(particleGeo, particleMat);
                particle.position.set(x, 0.2, z);
                
                const angle = (i / 12) * Math.PI * 2;
                const speed = 0.03 + Math.random() * 0.04;
                particle.userData = {
                    vx: Math.cos(angle) * speed,
                    vy: 0.05 + Math.random() * 0.05,
                    vz: Math.sin(angle) * speed,
                    life: 1.0
                };
                effectsGroup.add(particle);
                splashes.push(particle);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x032b43);
            scene.fog = new THREE.FogExp2(0x032b43, 0.03);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x7dd3fc, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xe0f2fe, 1.2);
            directionalLight.position.set(5, 15, 7);
            scene.add(directionalLight);

            // Бирюзовая подсветка снизу (эффект глубоководного свечения)
            const bottomLight = new THREE.PointLight(0x0284c7, 2, 25);
            bottomLight.position.set(0, -3, 0);
            scene.add(bottomLight);

            createBoard();
            createBubbles();
            setupBoardState();
            
            scene.add(tilesGroup);
            scene.add(piecesGroup);
            scene.add(effectsGroup);
            renderPieces();

            window.addEventListener('resize', onWindowResize);
            
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);

            animate();
        }

        function createBoard() {
            // Морские цвета клеток: кораллово-синий и глубокий океанский
            const darkMaterial = new THREE.MeshPhongMaterial({ color: 0x0c4a6e, shininess: 50, specular: 0x38bdf8 });
            const lightMaterial = new THREE.MeshPhongMaterial({ color: 0x075985, shininess: 50, specular: 0x7dd3fc });
            const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x0284c7, shininess: 20 });

            // Морская рифовая подложка под доску
            const baseGeo = new THREE.BoxGeometry(boardSize * tileSize + 0.6, 0.25, boardSize * tileSize + 0.6);
            const baseMesh = new THREE.Mesh(baseGeo, baseMaterial);
            baseMesh.position.y = -0.22;
            tilesGroup.add(baseMesh);

            for (let x = 0; x < boardSize; x++) {
                for (let z = 0; z < boardSize; z++) {
                    const geometry = new THREE.BoxGeometry(tileSize - 0.04, 0.15, tileSize - 0.04);
                    const material = (x + z) % 2 === 0 ? lightMaterial : darkMaterial;
                    const tile = new THREE.Mesh(geometry, material);
                    tile.position.set(x * tileSize - originOffset, 0, z * tileSize - originOffset);
                    tile.userData = { type: 'tile', x, z };
                    tilesGroup.add(tile);
                }
            }
        }

        function createBubbles() {
            const bubbleGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const bubbleMat = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                transmission: 0.9,
                opacity: 1,
                transparent: true,
                roughness: 0.1,
                ior: 1.15
            });

            for (let i = 0; i < 50; i++) {
                const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
                resetBubble(bubble);
                bubble.position.y = (Math.random() - 0.5) * 15;
                scene.add(bubble);
                bubbles.push(bubble);
            }
        }

        function resetBubble(bubble) {
            bubble.position.x = (Math.random() - 0.5) * 22;
            bubble.position.z = (Math.random() - 0.5) * 22;
            bubble.position.y = -6;
            bubble.userData = {
                speed: 0.015 + Math.random() * 0.035,
                wobbleSpeed: 1 + Math.random() * 2.5,
                wobbleDist: 0.2,
                initialX: bubble.position.x
            };
        }

        function createEmojiSprite(emoji, isBlueTeam) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.font = '96px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.clearRect(0, 0, 128, 128);
            
            if (isBlueTeam) {
                ctx.fillStyle = '#7dd3fc';
                ctx.shadowColor = '#0284c7';
                ctx.shadowBlur = 18;
            }

            ctx.fillText(emoji, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(0.8, 0.8, 0.8);
            return sprite;
        }

        function setupBoardState() {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) {
                            gameState[r][c] = { player: 'blue', king: false }; // Крабики
                        } else if (r > 4) {
                            gameState[r][c] = { player: 'red', king: false };  // Креветки
                        } else {
                            gameState[r][c] = 0;
                        }
                    } else {
                        gameState[r][c] = 0;
                    }
                }
            }
        }

        function renderPieces() {
            while (piecesGroup.children.length > 0) { 
                piecesGroup.remove(piecesGroup.children[0]); 
            }

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = gameState[r][c];
                    if (cell !== 0) {
                        let emoji = '🦀';
                        let isBlue = (cell.player === 'blue');
                        if (cell.player === 'red') {
                            emoji = cell.king ? '🦐' : '🍤';
                        }
                        
                        const sprite = createEmojiSprite(emoji, isBlue);
                        const posX = c * tileSize - originOffset;
                        const posZ = r * tileSize - originOffset;
                        const posY = (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) ? 0.45 : 0.3;
                        
                        sprite.position.set(posX, posY, posZ);
                        sprite.userData = { type: 'piece', r, c, player: cell.player };
                        
                        piecesGroup.add(sprite);
                    }
                }
            }
        }

        let pointerDownPos = { x: 0, y: 0 };
        let hasMoved = false;

        function onPointerDown(event) {
            if (event.clientY > window.innerHeight - 80) return;
            isDragging = true;
            hasMoved = false;
            previousMousePosition = { x: event.clientX, y: event.clientY };
            pointerDownPos = { x: event.clientX, y: event.clientY };
        }

        function onPointerMove(event) {
            if (!isDragging) return;

            const deltaX = event.clientX - previousMousePosition.x;
            const deltaY = event.clientY - previousMousePosition.y;

            if (Math.abs(event.clientX - pointerDownPos.x) > 5 || Math.abs(event.clientY - pointerDownPos.y) > 5) {
                hasMoved = true;
            }

            cameraAngleY -= deltaX * 0.008;
            cameraAngleX = Math.max(0.3, Math.min(1.4, cameraAngleX - deltaY * 0.008));

            updateCameraPosition();
            previousMousePosition = { x: event.clientX, y: event.clientY };
        }

        function onPointerUp(event) {
            isDragging = false;
            if (!hasMoved && event.clientY <= window.innerHeight - 80) {
                handleBoardClick(event);
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleBoardClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const pieceIntersects = raycaster.intersectObjects(piecesGroup.children);
            if (pieceIntersects.length > 0) {
                const clickedPiece = pieceIntersects[0].object;
                if (clickedPiece.userData && clickedPiece.userData.type === 'piece') {
                    if (clickedPiece.userData.player === turn) {
                        selectedPiece = { r: clickedPiece.userData.r, c: clickedPiece.userData.c };
                        renderPieces();
                        playSound('move');
                        return;
                    }
                }
            }

            if (selectedPiece) {
                const tileIntersects = raycaster.intersectObjects(tilesGroup.children);
                if (tileIntersects.length > 0) {
                    const clickedTile = tileIntersects[0].object;
                    if (clickedTile.userData && clickedTile.userData.type === 'tile') {
                        const tr = clickedTile.userData.z;
                        const tc = clickedTile.userData.x;
                        
                        const dr = tr - selectedPiece.r;
                        const dc = tc - selectedPiece.c;

                        const piece = gameState[selectedPiece.r][selectedPiece.c];
                        const forwardValid = piece.king || (turn === 'red' ? dr === -1 : dr === 1);

                        if (Math.abs(dc) === 1 && Math.abs(dr) === 1 && forwardValid && gameState[tr][tc] === 0) {
                            gameState[tr][tc] = piece;
                            gameState[selectedPiece.r][selectedPiece.c] = 0;

                            createSplash(tc * tileSize - originOffset, tr * tileSize - originOffset);
                            playSound('move');

                            if (turn === 'red' && tr === 0) {
                                gameState[tr][tc].king = true;
                                showArazaurReaction("🦖 ДАМКА! УРА!");
                                playSound('king');
                            }
                            if (turn === 'blue' && tr === 7) {
                                gameState[tr][tc].king = true;
                                showArazaurReaction("🦖 ДАМКА! УРА!");
                                playSound('king');
                            }

                            turn = turn === 'red' ? 'blue' : 'red';
                            document.getElementById('status').innerText = `Ход: ${turn === 'red' ? 'Креветки (Красные)' : 'Крабики (Синие)'}`;
                            selectedPiece = null;
                            renderPieces();
                        }
                        else if (Math.abs(dc) === 2 && Math.abs(dr) === 2 && gameState[tr][tc] === 0) {
                            const jumpedR = selectedPiece.r + dr / 2;
                            const jumpedC = selectedPiece.c + dc / 2;
                            const jumpedPiece = gameState[jumpedR][jumpedC];

                            if (jumpedPiece !== 0 && jumpedPiece.player !== turn) {
                                gameState[tr][tc] = piece;
                                gameState[selectedPiece.r][selectedPiece.c] = 0;
                                gameState[jumpedR][jumpedC] = 0;

                                createSplash(tc * tileSize - originOffset, tr * tileSize - originOffset);
                                showArazaurReaction("🦖 КРАСИВЫЙ БОЙ!");
                                playSound('jump');

                                if (turn === 'red' && tr === 0) {
                                    gameState[tr][tc].king = true;
                                    playSound('king');
                                }
                                if (turn === 'blue' && tr === 7) {
                                    gameState[tr][tc].king = true;
                                    playSound('king');
                                }

                                turn = turn === 'red' ? 'blue' : 'red';
                                document.getElementById('status').innerText = `Ход: ${turn === 'red' ? 'Креветки (Красные)' : 'Крабики (Синие)'}`;
                                selectedPiece = null;
                                renderPieces();
                            }
                        }
                    }
                }
            }
        }

        function toggleCamera() {
            cameraAngleY += Math.PI;
            updateCameraPosition();
        }

        function updateCameraPosition() {
            camera.position.x = cameraDistance * Math.sin(cameraAngleX) * Math.sin(cameraAngleY);
            camera.position.y = cameraDistance * Math.cos(cameraAngleX);
            camera.position.z = cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            camera.lookAt(0, 0, 0);
        }

        function resetGame() {
            setupBoardState();
            turn = 'red';
            selectedPiece = null;
            document.getElementById('status').innerText = 'Ход: Креветки (Красные)';
            renderPieces();
            showArazaurReaction("🦖 НОВАЯ ИГРА НАЧАЛАСЬ!");
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);

            bubbles.forEach((b, index) => {
                b.position.y += b.userData.speed;
                b.position.x = b.userData.initialX + Math.sin(timestamp * 0.002 + index) * 0.15;
                if (b.position.y > 7) {
                    resetBubble(b);
                }
            });

            for (let i = splashes.length - 1; i >= 0; i--) {
                const p = splashes[i];
                p.position.x += p.userData.vx;
                p.position.y += p.userData.vy;
                p.position.z += p.userData.vz;
                p.userData.vy -= 0.003;
                p.userData.life -= 0.03;
                p.material.opacity = p.userData.life;

                if (p.userData.life <= 0) {
                    effectsGroup.remove(p);
                    splashes.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
