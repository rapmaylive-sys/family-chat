<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamilyConnect - Рация</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0e1621] text-white h-screen flex flex-col items-center justify-center font-sans">

    <div id="chat" class="w-full max-w-md h-full flex flex-col bg-[#0e1621]">
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        
        <div class="p-6 bg-[#17212b] flex flex-col items-center gap-3">
            <button id="recordBtn" class="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-all touch-none">
                🎤
            </button>
            <div id="status" class="text-sm text-gray-400 font-medium">Зажми, чтобы сказать</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZ82pn4M8CX_2ySPBXjDBscfZVpS7mo_o",
            databaseURL: "https://familyconnect-f3026-default-rtdb.firebaseio.com",
            projectId: "familyconnect-f3026",
            storageBucket: "familyconnect-f3026.firebasestorage.app",
            appId: "1:586629397170:web:2560475f7b9c1315fda7ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);
        const messagesRef = ref(db, 'messages');

        const btn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        let mediaRecorder;
        let audioChunks = [];

        const startRecording = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                const storageReference = storageRef(storage, 'audio/' + Date.now() + '.ogg');
                await uploadBytes(storageReference, audioBlob);
                const url = await getDownloadURL(storageReference);
                push(messagesRef, { type: 'audio', url: url, time: Date.now() });
                status.textContent = "Зажми, чтобы сказать";
            };
            mediaRecorder.start();
            status.textContent = "Запись...";
        };

        // Поддержка и мыши, и касаний
        btn.addEventListener('mousedown', startRecording);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });

        const stopRecording = () => {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
        };

        btn.addEventListener('mouseup', stopRecording);
        btn.addEventListener('touchend', stopRecording);

        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const div = document.createElement('div');
            div.className = "p-3 bg-[#2b5278] rounded-2xl w-fit animate-in fade-in zoom-in duration-300";
            div.innerHTML = `<audio controls src="${msg.url}" class="h-8"></audio>`;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
    </script>
</body>
</html>
