<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Экран входа -->
    <div id="loginScreen" class="w-full max-w-sm bg-gray-800 p-8 rounded-2xl shadow-xl text-center">
        <h1 class="text-2xl font-bold mb-6 text-blue-400">FamilyConnect</h1>
        <input type="password" id="passInput" placeholder="Введите пароль" 
               class="w-full p-3 mb-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 text-white">
        <button id="loginBtn" class="w-full py-3 bg-blue-600 rounded-lg hover:bg-blue-700 transition font-bold">Войти</button>
    </div>

    <!-- Основной чат -->
    <div id="chatContainer" class="hidden w-full max-w-lg bg-gray-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-xl font-bold mb-4 text-blue-400">Семейный чат</h2>
        <div id="messages" class="h-64 overflow-y-auto mb-4 border-b border-gray-700 pb-2 space-y-2"></div>
        <div class="flex gap-2">
            <input type="text" id="msgInput" placeholder="Ваше сообщение..." class="flex-1 p-2 rounded-lg bg-gray-700 focus:outline-none text-white">
            <button id="sendBtn" class="px-6 py-2 bg-blue-600 rounded-lg hover:bg-blue-700 transition font-bold">></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Вставьте ваши реальные данные сюда
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
            projectId: "ВАШ_ПРОЕКТ",
            storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
            messagingSenderId: "ВАШ_ID",
            appId: "ВАШ_APP_ID"
        };
        const DB_URL = "https://ВАШ_ПРОЕКТ-default-rtdb.firebaseio.com";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, DB_URL);
        const messagesRef = ref(db, 'messages');

        // Логика кнопки входа с паролем "pipiki"
        document.getElementById('loginBtn').addEventListener('click', () => {
            const pass = document.getElementById('passInput').value.trim();
            if (pass === "pipiki") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('chatContainer').classList.remove('hidden');
            } else {
                alert("Неверный пароль!");
            }
        });

        // Отправка
        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            if (input.value.trim() !== "") {
                push(messagesRef, { text: input.value, time: Date.now() });
                input.value = "";
            }
        };

        // Получение
        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const div = document.createElement('div');
            div.className = "p-2 bg-gray-700 rounded-lg text-sm";
            div.textContent = msg.text;
            const msgsDiv = document.getElementById('messages');
            msgsDiv.appendChild(div);
            msgsDiv.scrollTop = msgsDiv.scrollHeight;
        });
    </script>
</body>
</html>
